name: Awaki Local AI Runtime

# Builds the prebuilt Python runtime the app unpacks on a phone
# (tools/local-runtime/build-awaki-runtime.sh).
#
# It is a separate workflow because it needs a native ARM64 runner: PyPI publishes no wheel for
# llama-cpp-python, so ggml has to be compiled, and compiling it for aarch64 on an x86_64 box
# would produce bytes that crash on every phone. A commit that touches the recipe builds the
# x86_64 bundle on every push, which runs the whole recipe without shipping anything; the shippable
# arm64 artifact still takes an explicit dispatch.
#
# The build script is invoked with `bash <script>`: the executable bit is not carried by every
# development machine in this project, and the recipe does not depend on it.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Runtime architecture to build'
        type: choice
        required: true
        default: aarch64
        options:
          - aarch64
          - armv7
      commit_to_repo:
        description: 'Commit the archive and catalog to app/src/main/assets/local-runtime on a branch'
        type: boolean
        required: true
        default: false
  # A change to the recipe, or to either side of the contract between the archive and the app that
  # unpacks it, gets a real x86_64 build. The arm64 artifact stays behind the dispatch below.
  pull_request:
    branches: ["main"]
    paths:
      - 'tools/local-runtime/**'
      - '.github/workflows/local-runtime.yml'
  push:
    branches: ["main"]
    paths:
      - 'tools/local-runtime/**'
      - '.github/workflows/local-runtime.yml'
      - 'app/src/main/java/com/awaki/local/**'
      - 'app/src/main/assets/local-models/serve.py'

permissions:
  contents: write

concurrency:
  group: local-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax check the recipe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: bash -n
        run: |
          set -euo pipefail
          if ! bash -n tools/local-runtime/build-awaki-runtime.sh; then
            echo "::error::tools/local-runtime/build-awaki-runtime.sh does not parse."
            exit 1
          fi
          echo "recipe parses"

      # Catches a catalog that no longer parses before a device ever tries to read it.
      - name: YAML syntax
        run: python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/local-runtime.yml')); print('workflow parses')"

  # The recipe is ~950 lines of shell whose output is a binary a phone cannot inspect. Building
  # the x86_64 bundle runs every step of it for real - pin cross-check against upstream, download,
  # pip, the llama.cpp compile, the trim, the library sweep, the relocation self-check, the pack
  # and the read-back of the packed bytes - so a recipe that stopped working says so on the commit
  # that broke it rather than on the release. Its bundle is never shipped: an x86_64 tree cannot
  # run on an arm64 phone.
  validate:
    name: Build an x86_64 runtime to prove the recipe
    needs: lint
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AWAKI_DOWNLOAD_CACHE: ${{ github.workspace }}/.cache/awaki/local-runtime
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Cache the interpreter archive
        uses: actions/cache@v4
        with:
          path: ${{ env.AWAKI_DOWNLOAD_CACHE }}
          key: awaki-python-x86_64-${{ hashFiles('tools/local-runtime/build-awaki-runtime.sh') }}
          restore-keys: |
            awaki-python-x86_64-

      - name: Build the runtime
        run: >-
          bash tools/local-runtime/build-awaki-runtime.sh
          --target x86_64
          --output-dir dist

      - name: Verify the archive that was produced
        run: bash tools/local-runtime/build-awaki-runtime.sh --verify-archive dist/awaki-runtime-x86_64.tar.gz

      - name: Check the catalog the app would read
        run: bash tools/local-runtime/build-awaki-runtime.sh --check-catalog dist/bundles-x86_64.json

  build:
    name: Build the ${{ inputs.arch }} runtime
    needs: lint
    # The shipping artifact is built on request, because it is a ~50 MB binary and merging it is a
    # decision a person makes. Ordinary pushes get the x86_64 build above instead.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      ARCH: ${{ inputs.arch }}
      # Where the build script keeps the interpreter tarball between runs.
      AWAKI_DOWNLOAD_CACHE: ${{ github.workspace }}/.cache/awaki/local-runtime
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The whole reason this job exists: a runner that is the architecture being produced.
      # armv7 needs a 32-bit host, which ubuntu-24.04-arm is not, and the script refuses to
      # cross-produce a bundle it cannot run.
      - name: Check the runner matches the requested architecture
        run: |
          set -euo pipefail
          machine="$(uname -m)"
          echo "runner architecture: $machine"
          if [ "$ARCH" = "aarch64" ] && [ "$machine" != "aarch64" ]; then
            echo "::error::arch=aarch64 must build on an aarch64 runner; this one is $machine. Use ubuntu-24.04-arm."
            exit 1
          fi
          if [ "$ARCH" = "armv7" ] && [ "$machine" = "aarch64" ]; then
            echo "::error::arch=armv7 needs a native 32-bit ARM host (uname -m armv7l): the armhf bundle is compiled by the host compiler, and an aarch64 runner cannot emit it. Build it on an armv7 machine with 'bash tools/local-runtime/build-awaki-runtime.sh --target armv7 --install-into-repo'."
            exit 1
          fi

      - name: Cache the interpreter archive
        uses: actions/cache@v4
        with:
          path: ${{ env.AWAKI_DOWNLOAD_CACHE }}
          key: awaki-python-${{ hashFiles('tools/local-runtime/build-awaki-runtime.sh') }}
          restore-keys: |
            awaki-python-

      # No apt-get here on purpose: cmake, g++ and the rest of the build toolchain are already
      # on the runner image, and the build never uses the runner's python - the interpreter it
      # is packaging runs pip itself. When the runtime is to be committed, the same single build
      # places it into the assets directory; nothing is compiled twice.
      - name: Build the runtime
        run: >-
          bash tools/local-runtime/build-awaki-runtime.sh
          --target "$ARCH"
          --output-dir dist
          ${{ inputs.commit_to_repo && '--install-into-repo' || '' }}

      # Defense in depth against a truncated or mis-staged asset: the archive that will be
      # committed is unpacked by the same reader the phone uses and re-checked, so a bundle that
      # only worked inside the build tree never reaches the APK.
      - name: Verify the archive that was produced
        run: |
          set -euo pipefail
          archive="dist/awaki-runtime-${ARCH}.tar.gz"
          if [ ! -s "$archive" ]; then
            echo "::error::${archive} was not produced."
            exit 1
          fi
          sha256sum "$archive"
          ls -l dist/
          bash tools/local-runtime/build-awaki-runtime.sh --verify-archive "$archive"

      - name: Check the catalog the app would read
        run: bash tools/local-runtime/build-awaki-runtime.sh --check-catalog "dist/bundles-${ARCH}.json"

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: awaki-runtime-${{ inputs.arch }}
          path: |
            dist/awaki-runtime-*.tar.gz
            dist/bundles-*.json
          if-no-files-found: error
          retention-days: 30

      # Gated behind an explicit input, and pushed to its own branch: main is never written by
      # CI, because a 50 MB binary landing under a merge button is a decision a person makes.
      # The files it commits are the ones the build step already placed and verified.
      - name: Commit the runtime into the repository
        if: ${{ inputs.commit_to_repo }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="local-runtime-${ARCH}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ ! -f "app/src/main/assets/local-runtime/awaki-runtime-${ARCH}.tar.gz" ]; then
            echo "::error::the build did not place the runtime under app/src/main/assets/local-runtime."
            exit 1
          fi
          git add app/src/main/assets/local-runtime
          if git diff --cached --quiet; then
            echo "The runtime already in the repository is current - nothing to commit."
            exit 0
          fi
          git commit -m "chore(runtime): rebuild the ${ARCH} model runtime bundle [skip ci]"
          git push origin "HEAD:refs/heads/${BRANCH}"

          {
            echo "### Runtime bundle published"
            echo
            echo "- branch: \`${BRANCH}\`"
            echo "- archive: \`app/src/main/assets/local-runtime/awaki-runtime-${ARCH}.tar.gz\`"
            echo "- sha256: \`$(sha256sum "dist/awaki-runtime-${ARCH}.tar.gz" | cut -d' ' -f1)\`"
            echo
            echo "Merge it with:"
            echo
            echo '```'
            echo "gh pr create --base main --head ${BRANCH} --title \"${ARCH} model runtime bundle\" --body \"\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
