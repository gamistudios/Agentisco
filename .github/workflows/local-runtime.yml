name: Awaki Local AI Runtime

# The runtime the app unpacks on a phone (tools/local-runtime/build-awaki-runtime.sh) is built
# locally and committed: every input is a prebuilt wheel, nothing is compiled, and re-downloading
# ~90 MB to reproduce bytes that are already in git is not a way to spend CI minutes.
#
# So this workflow checks the artifact instead of producing it. On a change to the recipe or the
# asset it validates the catalog the app parses and re-runs the acceptance self-check against the
# archive in the repo - on an ordinary x86_64 runner, because the check executes the arm64 tree
# under qemu-user inside the app's own Ubuntu rootfs.
#
# A real rebuild stays available on request as a reproducibility gate (workflow_dispatch): it
# rebuilds from the pins and fails if the digest no longer matches the committed bundle, which is
# how a floating pin or a byte-code path that stopped being stable would surface.
#
# The build script is invoked with `bash <script>`: the executable bit is not carried by every
# development machine in this project, and the recipe does not depend on it.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Runtime architecture to rebuild for the reproducibility gate'
        type: choice
        required: true
        default: aarch64
        options:
          - aarch64
          - x86_64
  pull_request:
    branches: ["main"]
    paths:
      - 'tools/local-runtime/**'
      - '.github/workflows/local-runtime.yml'
      - 'app/src/main/assets/local-runtime/**'
  push:
    branches: ["main"]
    paths:
      - 'tools/local-runtime/**'
      - '.github/workflows/local-runtime.yml'
      - 'app/src/main/assets/local-runtime/**'
      - 'app/src/main/java/com/awaki/local/**'
      - 'app/src/main/assets/local-models/serve.py'

permissions:
  contents: read

concurrency:
  group: local-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNTIME_ASSET: app/src/main/assets/local-runtime/awaki-runtime-aarch64.pack
  RUNTIME_CATALOG: app/src/main/assets/local-runtime/bundles.json

jobs:
  lint:
    name: Syntax check the recipe and the catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: bash -n
        run: |
          set -euo pipefail
          if ! bash -n tools/local-runtime/build-awaki-runtime.sh; then
            echo "::error::tools/local-runtime/build-awaki-runtime.sh does not parse."
            exit 1
          fi
          echo "recipe parses"

      - name: YAML syntax
        run: python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/local-runtime.yml')); print('workflow parses')"

      # Catches a catalog that no longer matches the keys RuntimeBundle.kt parses before a device
      # ever reads it and finds "no runtime for this ABI".
      - name: Check the catalog the app would read
        run: bash tools/local-runtime/build-awaki-runtime.sh --check-catalog "$RUNTIME_CATALOG"

  verify:
    name: Run the committed runtime inside the app rootfs
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install the user-mode emulator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static binutils

      - name: Confirm the bundle the APK will carry is the one that was built
        run: |
          set -euo pipefail
          test -s "$RUNTIME_ASSET" || { echo "::error::$RUNTIME_ASSET is missing or empty."; exit 1; }
          ls -l "$RUNTIME_ASSET"
          echo "archive sha256 $(sha256sum "$RUNTIME_ASSET" | cut -d' ' -f1)"
          # The catalog's digest has to be the committed bytes' digest: an entry that points at a
          # bundle which is not there (or is a different bundle) fails its checksum on the phone and
          # the local-models screen never gets a runtime.
          catalog_sha="$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['bundles'][0]['sha256'])" "$RUNTIME_CATALOG")"
          actual_sha="$(sha256sum "$RUNTIME_ASSET" | cut -d' ' -f1)"
          if [ "$catalog_sha" != "$actual_sha" ]; then
            echo "::error::bundles.json says $catalog_sha but the asset is $actual_sha."
            exit 1
          fi
          echo "catalog digest matches the asset"

      # Unpacks the archive the way the phone does, puts it in a second path, and executes it under
      # qemu-aarch64-static with the app's own Ubuntu rootfs as the sysroot: the same glibc, OpenSSL
      # and libstdc++ a Galaxy A15 will hand it. The script refuses this check outright if the
      # emulator is missing, so a passing run here really did run the interpreter.
      - name: Verify the archive
        run: bash tools/local-runtime/build-awaki-runtime.sh --verify-archive "$RUNTIME_ASSET"

  rebuild:
    name: Rebuild ${{ inputs.arch }} and compare its digest
    if: github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARCH: ${{ inputs.arch }}
      AWAKI_DOWNLOAD_CACHE: ${{ github.workspace }}/.cache/awaki/local-runtime
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install the user-mode emulator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static binutils

      - name: Cache the interpreter and the wheels
        uses: actions/cache@v4
        with:
          path: ${{ env.AWAKI_DOWNLOAD_CACHE }}
          key: awaki-runtime-${{ inputs.arch }}-${{ hashFiles('tools/local-runtime/build-awaki-runtime.sh') }}
          restore-keys: |
            awaki-runtime-${{ inputs.arch }}-

      - name: Build the runtime
        run: |
          set -euo pipefail
          bash tools/local-runtime/build-awaki-runtime.sh --target "$ARCH" --output-dir dist
          bash tools/local-runtime/build-awaki-runtime.sh --verify-archive "dist/awaki-runtime-${ARCH}.pack"
          bash tools/local-runtime/build-awaki-runtime.sh --check-catalog "dist/bundles-${ARCH}.json"

      # The point of dispatching a build: same pins on a different machine must mean same bytes. A
      # mismatch is a pin that floats, a temp path that leaked into a .pyc, or an mtime that was not
      # normalised - all of which re-download a runtime onto every phone in the field. Only arm64
      # has a committed bundle to compare against; x86_64 is the recipe proving itself.
      - name: Compare with the bundle in the repository
        if: inputs.arch == 'aarch64'
        run: |
          set -euo pipefail
          rebuilt="$(sha256sum "dist/awaki-runtime-aarch64.pack" | cut -d' ' -f1)"
          committed="$(sha256sum "$RUNTIME_ASSET" | cut -d' ' -f1)"
          echo "rebuilt  $rebuilt"
          echo "committed $committed"
          if [ "$rebuilt" != "$committed" ]; then
            echo "::error::the rebuild is not the committed bundle. Either update the asset with --install-into-repo, or find the nondeterminism."
            exit 1
          fi

      - name: Upload the rebuilt bundle
        uses: actions/upload-artifact@v4
        with:
          name: awaki-runtime-${{ inputs.arch }}
          path: |
            dist/awaki-runtime-*.pack
            dist/bundles-*.json
          if-no-files-found: error
          retention-days: 14
