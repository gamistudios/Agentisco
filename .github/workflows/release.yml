name: Build & Release ScoOS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'ScoOS Release'
      is_draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Determine Version & Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            TITLE="ScoOS $TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "Building ScoOS for tag: $TAG ($TITLE)"

      - name: Configure Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using provided repository secrets for release signing..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          else
            echo "No custom release secrets found; generating self-signed release keystore for build artifact..."
            keytool -genkey -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -alias "upload" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "scoos-release-password" \
              -keypass "scoos-release-password" \
              -dname "CN=ScoOS, OU=Android, O=ScoOS, L=Global, S=Mobile, C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=scoos-release-password" >> $GITHUB_ENV
            echo "KEY_PASSWORD=scoos-release-password" >> $GITHUB_ENV
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK and App Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease assembleDebug --stacktrace

      - name: Organize Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.vars.outputs.tag }}"

          # Copy and rename Release APK
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk "release-artifacts/ScoOS-${TAG}-release.apk"
          fi

          # Copy and rename Release AAB (Android App Bundle for Google Play)
          if compgen -G "app/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp app/build/outputs/bundle/release/*.aab "release-artifacts/ScoOS-${TAG}-release.aab"
          fi

          # Copy and rename Debug APK (for quick testing)
          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            cp app/build/outputs/apk/debug/*.apk "release-artifacts/ScoOS-${TAG}-debug.apk"
          fi

          ls -lah release-artifacts/

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: scoos-build-${{ steps.vars.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
