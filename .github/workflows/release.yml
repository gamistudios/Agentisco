name: Build & Release ScoOS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Optional custom tag (e.g. v1.0.5). Leave empty for auto-increment from 1.0.0'
        required: false
        default: ''
      release_title:
        description: 'Optional Release Title'
        required: false
        default: ''
      is_draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Determine Next Version & Tag
        id: vars
        run: |
          # Fetch existing git tags
          git fetch --tags --force 2>/dev/null || true

          CUSTOM_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$CUSTOM_TAG" ]; then
            TAG="$CUSTOM_TAG"
            VERSION="${TAG#v}"
            PATCH=$(echo "$VERSION" | awk -F. '{print $3}')
            VERSION_CODE=$((PATCH + 1))
          else
            # Find the highest existing v1.0.* tag
            LATEST_TAG=$(git tag -l "v1.0.*" --sort=-v:refname | head -n 1)

            if [ -z "$LATEST_TAG" ]; then
              VERSION="1.0.0"
              PATCH="0"
            else
              PATCH=$(echo "$LATEST_TAG" | sed 's/^v1\.0\.//')
              if [[ "$PATCH" =~ ^[0-9]+$ ]]; then
                PATCH=$((PATCH + 1))
                VERSION="1.0.${PATCH}"
              else
                VERSION="1.0.0"
                PATCH="0"
              fi
            fi

            TAG="v${VERSION}"
            VERSION_CODE=$((PATCH + 1))

            # Ensure tag doesn't collide with existing ref
            while git rev-parse "$TAG" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
              VERSION="1.0.${PATCH}"
              TAG="v${VERSION}"
              VERSION_CODE=$((PATCH + 1))
            done
          fi

          CUSTOM_TITLE="${{ github.event.inputs.release_title }}"
          if [ -n "$CUSTOM_TITLE" ]; then
            TITLE="$CUSTOM_TITLE"
          else
            TITLE="ScoOS $TAG"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

          echo "Target Version: $VERSION (Code: $VERSION_CODE, Tag: $TAG, Title: $TITLE)"

          # Update version dynamically in app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${VERSION}\"/" app/build.gradle.kts

      - name: Configure Signing Keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using provided repository secrets for release signing..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          else
            echo "No custom release secrets found; generating self-signed release keystore for build artifact..."
            keytool -genkey -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -alias "upload" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "scoos-release-password" \
              -keypass "scoos-release-password" \
              -dname "CN=ScoOS, OU=Android, O=ScoOS, L=Global, S=Mobile, C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=scoos-release-password" >> $GITHUB_ENV
            echo "KEY_PASSWORD=scoos-release-password" >> $GITHUB_ENV
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Release APK and App Bundle (AAB)
        run: ./gradlew assembleRelease bundleRelease assembleDebug --stacktrace

      - name: Organize Release Artifacts
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.vars.outputs.tag }}"

          # Copy and rename Release APK
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk "release-artifacts/ScoOS-${TAG}-release.apk"
          fi

          # Copy and rename Release AAB (Android App Bundle for Google Play)
          if compgen -G "app/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp app/build/outputs/bundle/release/*.aab "release-artifacts/ScoOS-${TAG}-release.aab"
          fi

          # Copy and rename Debug APK (for quick testing)
          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            cp app/build/outputs/apk/debug/*.apk "release-artifacts/ScoOS-${TAG}-debug.apk"
          fi

          ls -lah release-artifacts/

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: scoos-build-${{ steps.vars.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create and Push Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.vars.outputs.tag }}"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "ScoOS Release $TAG"
            git push origin "$TAG" || true
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.title }}
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
