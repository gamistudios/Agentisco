name: Agentisco CI/CD

# One unified pipeline:
#   1. "validate" — CI checks and tests (always runs, including PRs).
#   2. "release"  — always builds + publishes the debug APK; additionally builds
#                   and publishes the SIGNED release APK + AAB when the head
#                   commit message requests a release:
#                       "release"          -> auto-increment patch from latest tag
#                       "release v1.2.3"   -> use exactly v1.2.3
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build and publish the signed release APK/AAB as well'
        type: boolean
        default: false
      tag_name:
        description: 'Optional custom tag (e.g. v1.0.5). Leave empty for auto-increment. A non-empty value implies a release build.'
        required: false
        default: ''
      release_title:
        description: 'Optional Release Title'
        required: false
        default: ''
      is_draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

jobs:
  # ---------- Stage 1: CI validation ----------
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-28"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;27.2.12479018"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Debug Keystore
        env:
          AGENTISCO_DEBUG_KEYSTORE_BASE64: ${{ secrets.AGENTISCO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AGENTISCO_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Using GitHub secret AGENTISCO_DEBUG_KEYSTORE_BASE64..."
            echo "$AGENTISCO_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using pre-encoded debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Using existing debug.keystore..."
          fi

      - name: Build Debug APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          ANDROID_KEYSTORE_PASSWORD: android
          ANDROID_KEY_ALIAS: androiddebugkey
          ANDROID_KEY_PASSWORD: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

  # ---------- Stage 2: Build & publish ----------
  # Runs only when stage 1 succeeded, and never on pull requests.
  # The debug APK is built and published on EVERY run; the signed release
  # APK/AAB only when the head commit (or a manual dispatch) asks for it.
  release:
    name: Build & Publish Release
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-28"
          sdkmanager "cmake;3.22.1"
          sdkmanager "ndk;27.2.12479018"

      # Release detection + version resolution.
      # The commit message is read from git (never interpolated into the shell)
      # so a crafted commit message cannot inject script.
      - name: Determine Release Mode, Version & Tag
        id: vars
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag_name }}
          DISPATCH_TITLE: ${{ github.event.inputs.release_title }}
          DISPATCH_BUILD_RELEASE: ${{ github.event.inputs.build_release }}
        run: |
          set -euo pipefail
          git fetch --tags --force 2>/dev/null || true

          COMMIT_MSG="$(git log -1 --pretty=%B HEAD)"
          IS_RELEASE=false
          TAG=""

          # 1. "release vX.Y.Z" in the commit message -> exact version.
          EXPLICIT="$(printf '%s' "$COMMIT_MSG" \
            | grep -ioE '(^|[[:space:]])release[[:space:]]+v[0-9]+\.[0-9]+\.[0-9]+' \
            | head -n 1 \
            | grep -oiE 'v[0-9]+\.[0-9]+\.[0-9]+' || true)"

          if [ -n "$EXPLICIT" ]; then
            IS_RELEASE=true
            # Normalise to the vMAJOR.MINOR.PATCH tag format used by this repo.
            TAG="v$(printf '%s' "$EXPLICIT" | cut -c2-)"
          elif printf '%s' "$COMMIT_MSG" | grep -qiE '(^|[[:space:]])release([[:space:]]|$)'; then
            # 2. bare "release" -> auto-increment.
            IS_RELEASE=true
          fi

          # 3. Manual dispatch overrides.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${DISPATCH_TAG:-}" ]; then
              if ! printf '%s' "$DISPATCH_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                echo "::error::tag_name must be in vMAJOR.MINOR.PATCH format (got '${DISPATCH_TAG}')."
                exit 1
              fi
              TAG="$DISPATCH_TAG"
              IS_RELEASE=true
            fi
            if [ "${DISPATCH_BUILD_RELEASE:-false}" = "true" ]; then
              IS_RELEASE=true
            fi
          fi

          # Every run still needs a version for the debug artifact + tag, so the
          # auto-increment runs regardless of release mode.
          if [ -z "$TAG" ]; then
            LATEST_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"
            if [ -z "$LATEST_TAG" ]; then
              MAJOR=1; MINOR=0; PATCH=0
            else
              BASE="${LATEST_TAG#v}"
              MAJOR="$(echo "$BASE" | cut -d. -f1)"
              MINOR="$(echo "$BASE" | cut -d. -f2)"
              PATCH="$(echo "$BASE" | cut -d. -f3)"
              PATCH=$((PATCH + 1))
            fi
            TAG="v${MAJOR}.${MINOR}.${PATCH}"
            # Never collide with an existing tag/release.
            while git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; do
              PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            done
          else
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} already exists. Pick a new version."
              exit 1
            fi
          fi

          VERSION="${TAG#v}"
          MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          MINOR="$(echo "$VERSION" | cut -d. -f2)"
          PATCH="$(echo "$VERSION" | cut -d. -f3)"
          # Monotonic across all MAJOR.MINOR.PATCH values.
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          if [ -n "${DISPATCH_TITLE:-}" ]; then
            TITLE="$DISPATCH_TITLE"
          else
            TITLE="Agentisco $TAG"
          fi

          # Previous tag (before this run's tag is created) for the changelog range.
          PREV_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"

          {
            echo "is_release=$IS_RELEASE"
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "title=$TITLE"
            echo "prev_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

          echo "Release build: $IS_RELEASE"
          echo "Target Version: $VERSION (Code: $VERSION_CODE, Tag: $TAG, Title: $TITLE, Since: ${PREV_TAG:-<start>})"

          # Update version dynamically in app/build.gradle.kts
          sed -i "s/versionCode = .*/versionCode = ${VERSION_CODE}/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${VERSION}\"/" app/build.gradle.kts

      # Release notes are the real commit messages, verbatim, one entry each.
      - name: Generate Release Notes from Commits
        id: notes
        env:
          PREV_TAG: ${{ steps.vars.outputs.prev_tag }}
        run: |
          set -euo pipefail
          if [ -n "${PREV_TAG:-}" ] && git rev-parse -q --verify "refs/tags/${PREV_TAG}" >/dev/null 2>&1; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          git log $RANGE --no-merges --reverse --pretty=format:'%x1e%s%x1f%b' \
            | awk -v RS='\036' -v FS='\037' '
                {
                  subject = $1; body = $2
                  gsub(/^[ \t\r\n]+|[ \t\r\n]+$/, "", subject)
                  if (subject == "") next
                  low = tolower(subject)
                  # Skip a commit that only exists to trigger the release.
                  if (low ~ /^release([ \t]+v[0-9]+\.[0-9]+\.[0-9]+)?[ \t]*$/) next
                  print "- " subject
                  n = split(body, lines, "\n")
                  for (i = 1; i <= n; i++) {
                    l = lines[i]
                    gsub(/[ \t\r]+$/, "", l)
                    if (l != "") print "  " l
                  }
                }
              ' > commit-notes.md

          {
            echo "## What's Changed"
            echo
            if [ -s commit-notes.md ]; then
              cat commit-notes.md
            else
              echo "_No commits since ${PREV_TAG:-the start of the project}._"
            fi
            echo
            if [ -n "${PREV_TAG:-}" ]; then
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${{ steps.vars.outputs.tag }}"
            fi
          } > release-notes.md

          echo "--- release-notes.md ---"
          cat release-notes.md

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Setup Debug Keystore
        env:
          AGENTISCO_DEBUG_KEYSTORE_BASE64: ${{ secrets.AGENTISCO_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$AGENTISCO_DEBUG_KEYSTORE_BASE64" ]; then
            echo "Using GitHub secret AGENTISCO_DEBUG_KEYSTORE_BASE64..."
            echo "$AGENTISCO_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            echo "Using pre-encoded debug.keystore.base64..."
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            echo "Generating debug.keystore..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "$(keytool -list -keystore debug.keystore -alias androiddebugkey -storepass android 2>&1 | grep -i 'SHA256' | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "AGENTISCO_KEYSTORE_PATH=${github.workspace}/debug.keystore" >> "$GITHUB_ENV"

      # Always built, independent of release detection.
      - name: Build Debug APK
        env:
          AGENTISCO_KEYSTORE_PATH: ${{ github.workspace }}/debug.keystore
          AGENTISCO_KEYSTORE_PASSWORD: android
          AGENTISCO_KEY_ALIAS: androiddebugkey
          AGENTISCO_KEY_PASSWORD: android
        run: ./gradlew assembleDebug --stacktrace

      # Only runs for a release. Keystore is decoded to RUNNER_TEMP (outside the
      # workspace, never committed, never uploaded) and removed afterwards.
      # The keystore is generated/rotated LOCALLY via ./generate-keystore.sh —
      # never generate release keys in CI: a throwaway key produces APKs that
      # refuse to update-install over older builds.
      - name: Configure Release Signing
        if: steps.vars.outputs.is_release == 'true'
        env:
          AGENTISCO_KEYSTORE_BASE64: ${{ secrets.AGENTISCO_KEYSTORE_BASE64 }}
          AGENTISCO_KEYSTORE_PASSWORD: ${{ secrets.AGENTISCO_KEYSTORE_PASSWORD }}
          AGENTISCO_KEY_ALIAS: ${{ secrets.AGENTISCO_KEY_ALIAS }}
          AGENTISCO_KEY_PASSWORD: ${{ secrets.AGENTISCO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MISSING=""
          [ -n "${AGENTISCO_KEYSTORE_BASE64:-}" ]   || MISSING="$MISSING AGENTISCO_KEYSTORE_BASE64"
          [ -n "${AGENTISCO_KEYSTORE_PASSWORD:-}" ] || MISSING="$MISSING AGENTISCO_KEYSTORE_PASSWORD"
          [ -n "${AGENTISCO_KEY_ALIAS:-}" ]         || MISSING="$MISSING AGENTISCO_KEY_ALIAS"
          [ -n "${AGENTISCO_KEY_PASSWORD:-}" ]      || MISSING="$MISSING AGENTISCO_KEY_PASSWORD"
          if [ -n "$MISSING" ]; then
            echo "::error::Release requested but these repository secrets are missing:$MISSING"
            exit 1
          fi

          KEYSTORE_PATH="${RUNNER_TEMP}/agentisco-release.jks"
          printf '%s' "$AGENTISCO_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty — check AGENTISCO_KEYSTORE_BASE64."
            exit 1
          fi
          # Only the path is exported; passwords stay in step-level env below.
          echo "AGENTISCO_KEYSTORE_PATH=${KEYSTORE_PATH}" >> "$GITHUB_ENV"
          echo "Release keystore prepared ($(wc -c < "$KEYSTORE_PATH") bytes)."

      - name: Build Signed Release APK and App Bundle (AAB)
        if: steps.vars.outputs.is_release == 'true'
        env:
          AGENTISCO_KEYSTORE_PASSWORD: ${{ secrets.AGENTISCO_KEYSTORE_PASSWORD }}
          AGENTISCO_KEY_ALIAS: ${{ secrets.AGENTISCO_KEY_ALIAS }}
          AGENTISCO_KEY_PASSWORD: ${{ secrets.AGENTISCO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Remove Release Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/agentisco-release.jks"

      - name: Organize Release Artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          TAG="${{ steps.vars.outputs.tag }}"

          # Debug APK — always published.
          if compgen -G "app/build/outputs/apk/debug/*.apk" > /dev/null; then
            cp app/build/outputs/apk/debug/*.apk "release-artifacts/Agentisco-${TAG}-debug.apk"
          fi

          # Release APK / AAB — only present on release runs.
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            cp app/build/outputs/apk/release/*.apk "release-artifacts/Agentisco-${TAG}-release.apk"
          fi
          if compgen -G "app/build/outputs/bundle/release/*.aab" > /dev/null; then
            cp app/build/outputs/bundle/release/*.aab "release-artifacts/Agentisco-${TAG}-release.aab"
          fi

          if [ "${{ steps.vars.outputs.is_release }}" = "true" ]; then
            if [ ! -f "release-artifacts/Agentisco-${TAG}-release.apk" ] || \
               [ ! -f "release-artifacts/Agentisco-${TAG}-release.aab" ]; then
              echo "::error::Release was requested but the signed APK/AAB is missing."
              exit 1
            fi
          fi

          ls -lah release-artifacts/

      - name: Upload Artifacts to Workflow
        uses: actions/upload-artifact@v7
        with:
          name: agentisco-build-${{ steps.vars.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Create and Push Git Tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="${{ steps.vars.outputs.tag }}"
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Agentisco Release $TAG"
            git push origin "$TAG"
          fi

      # Published with the gh CLI instead of an upload action: the release is
      # created first with the notes, then each asset is uploaded ONE AT A TIME
      # with retries. Parallel multi-asset uploads are what produce the
      # intermittent "Error saving asset" / "Error creating asset temp dir"
      # failures on large APK/AAB files, and a failed parallel batch can leave
      # the release with a partial, inconsistent asset set.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.vars.outputs.tag }}
          TITLE: ${{ steps.vars.outputs.title }}
          IS_DRAFT: ${{ github.event.inputs.is_draft || 'false' }}
          IS_PRERELEASE: ${{ github.event.inputs.is_prerelease || 'false' }}
        run: |
          set -euo pipefail

          FLAGS=()
          if [ "$IS_DRAFT" = "true" ]; then
            FLAGS+=(--draft)
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          # 1. Create (or update) the release with the commit-derived notes.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating notes."
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md ${FLAGS[@]+"${FLAGS[@]}"}
          else
            gh release create "$TAG" --title "$TITLE" --notes-file release-notes.md ${FLAGS[@]+"${FLAGS[@]}"}
          fi

          # 2. Wait until the release is resolvable by tag before uploading.
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            echo "Release $TAG not discoverable yet, waiting..."
            sleep 5
          done

          # 3. Upload assets sequentially, retrying each one.
          FAILED=""
          for FILE in release-artifacts/*; do
            NAME="$(basename "$FILE")"
            UPLOADED=false
            for ATTEMPT in 1 2 3 4; do
              echo "⬆️  Uploading ${NAME} (attempt ${ATTEMPT})..."
              if gh release upload "$TAG" "$FILE" --clobber; then
                UPLOADED=true
                break
              fi
              echo "::warning::Upload of ${NAME} failed on attempt ${ATTEMPT}; retrying."
              sleep $((ATTEMPT * 15))
            done
            if [ "$UPLOADED" != "true" ]; then
              FAILED="$FAILED $NAME"
            fi
          done

          # 4. Verify every expected asset is actually attached.
          echo "Assets currently on $TAG:"
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee uploaded-assets.txt

          for FILE in release-artifacts/*; do
            NAME="$(basename "$FILE")"
            if ! grep -Fxq "$NAME" uploaded-assets.txt; then
              FAILED="$FAILED $NAME"
            fi
          done

          if [ -n "$FAILED" ]; then
            FAILED="$(printf '%s' "$FAILED" | tr ' ' '\n' | sort -u | tr '\n' ' ')"
            echo "::error::These assets are missing from release ${TAG}:$FAILED"
            exit 1
          fi

          echo "🎉 Release $TAG published with all assets."